
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APRENDE MATEMATICA</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
    background: radial-gradient(circle at center, #0a1f44, #000814);
}

.hero {
    min-height: 100vh;
    height: 760px;
    position: relative;
    color: white;
    overflow: hidden;
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
}

.contenido {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    text-align: center;
    width: 70%;
    pointer-events: none;
}

.contenido h1 {
    font-size: clamp(27px, 4vw, 55px);
    margin: 10px 0;
    text-shadow: 0 0 10px #006eff, 0 0 20px #006eff;
}

.contenido p {
    font-size: 18px;
    line-height: 1.5;
}

.colegio {
    position: absolute;
    top: 15px;
    right: 25px;
    z-index: 30;
}

.colegio img {
    width: 140px;
    max-width: 16vw;
    height: auto;
}

.menu {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(1100px, 96%);
    height: 540px;
    z-index: 20;
}

.menu button {
    position: absolute;
    width: 290px;
    min-height: 82px;
    padding: 12px 16px;
    border: 8px solid #080808;
    border-radius: 55px;
    color: white;
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    transition: filter 0.25s, box-shadow 0.25s, transform 0.25s;
    text-shadow: 2px 2px 4px #000;
    box-shadow: 10px 12px 0 #050505,
                0 0 18px rgba(0, 80, 255, 0.6);
    background: radial-gradient(
        circle at 50% 20%,
        #176cff,
        #071a45 65%,
        #020817
    );
}

.menu button::before {
    content: "";
    position: absolute;
    top: 7px;
    left: 15%;
    width: 70%;
    height: 20px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.18);
    filter: blur(4px);
    pointer-events: none;
}

.menu button:hover {
    filter: brightness(1.25);
    box-shadow: 6px 8px 0 #050505,
                0 0 30px rgba(0, 100, 255, 0.9);
}


.menu button:nth-child(1) {
    top: 0;
    left: 50%;
    transform: translateX(-50%);
}

.menu button:nth-child(1):hover {
    transform: translateX(-50%) scale(1.05);
}


.menu button:nth-child(2) {
    top: 38%;
    left: -65px;
    transform: translateY(-50%);
}

.menu button:nth-child(2):hover {
    transform: translateY(-50%) scale(1.05);
}


.menu button:nth-child(3) {
    top: 38%;
    right: -65px;
    transform: translateY(-50%);
}

.menu button:nth-child(3):hover {
    transform: translateY(-50%) scale(1.05);
}


.menu button:nth-child(4) {
    bottom: 65px;
    left: 12%;
}

.menu button:nth-child(4):hover {
    transform: scale(1.05);
}


.menu button:nth-child(5) {
    bottom: 65px;
    right: 12%;
}

.menu button:nth-child(5):hover {
    transform: scale(1.05);
}

.seccion {
    background: linear-gradient(180deg, #d7f0ff, #ffffff);
    padding: 80px 20px;
    text-align: center;
}

.seccion h2 {
    color: #003b73;
    font-size: 35px;
}

.grid {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 30px;
}

.card {
    width: 200px;
    border-radius: 15px;
    overflow: hidden;
    cursor: pointer;
    background: white;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    transition: transform 0.3s;
}

.card:hover {
    transform: scale(1.07);
}

.card img {
    width: 100%;
    height: 130px;
    object-fit: cover;
}

.card p {
    padding: 12px;
    margin: 0;
    font-weight: bold;
    color: #003b73;
    text-align: center;
}


@media (max-width: 1100px) {
    .menu {
        width: 96%;
    }

    .menu button {
        width: 240px;
        font-size: 21px;
        border-width: 7px;
    }

    .menu button:nth-child(2) {
        left: -10px;
    }

    .menu button:nth-child(3) {
        right: -10px;
    }

    .menu button:nth-child(4) {
        left: 5%;
    }

    .menu button:nth-child(5) {
        right: 5%;
    }
}


@media (max-width: 900px) {
    .hero {
        height: 800px;
    }

    .menu {
        height: 530px;
        width: 96%;
    }

    .menu button {
        width: 210px;
        min-height: 68px;
        font-size: 17px;
        padding: 10px;
        border-width: 6px;
    }

    .menu button:nth-child(2) {
        left: -5px;
    }

    .menu button:nth-child(3) {
        right: -5px;
    }

    .menu button:nth-child(4) {
        left: 2%;
        bottom: 55px;
    }

    .menu button:nth-child(5) {
        right: 2%;
        bottom: 55px;
    }

    .contenido {
        width: 60%;
    }

    .contenido p {
        font-size: 15px;
    }

    .colegio img {
        width: 100px;
    }
}


@media (max-width: 600px) {
    .hero {
        height: 850px;
        min-height: 850px;
    }

    .colegio {
        top: 10px;
        right: 10px;
    }

    .colegio img {
        width: 70px;
        max-width: 20vw;
    }

    .contenido {
        top: 34%;
        width: 90%;
    }

    .contenido h1 {
        font-size: 27px;
    }

    .contenido p {
        font-size: 13px;
    }

    .menu {
        top: 62%;
        height: 430px;
        width: 100%;
    }

    .menu button {
        width: 44%;
        min-height: 60px;
        padding: 8px 5px;
        font-size: 13px;
        letter-spacing: 1px;
        border-width: 5px;
        border-radius: 35px;
        box-shadow: 5px 7px 0 #050505,
                    0 0 12px rgba(0, 80, 255, 0.6);
    }

    .menu button:nth-child(1) {
        top: 0;
    }

    .menu button:nth-child(2) {
        top: 27%;
        left: 2%;
    }

    .menu button:nth-child(3) {
        top: 27%;
        right: 2%;
    }

    .menu button:nth-child(4) {
        bottom: 10%;
        left: 2%;
    }

    .menu button:nth-child(5) {
        bottom: 10%;
        right: 2%;
    }
}
</style>
</head>

<body>

<div class="colegio">
    <img src="img/SMMP.png" alt="Logo del colegio">
</div>

<div class="hero">

    <div class="contenido">
        <h1>APRENDE MATEMATICA</h1>
        <h1>4To de secundaria</h1>

        <p>
            Bienvenidos a esta página explicativa del área de matemática
            para estudiantes que están cursando el nivel secundario.
        </p>
    </div>

    <div class="menu">

        <button onclick="location.href='1yo.html'">
            TEMAS
        </button>

        <button onclick="location.href='2yo.html'">
            EJERCICIOS
        </button>

        <button onclick="location.href='3yo.html'">
            JUEGOS
        </button>

        <button onclick="location.href='actualizaciones_corregido (7).html'">
            ACTUALIZACIONES
        </button>

        <button onclick="location.href='acerca de nosotros.html'">
            ACERCA DE NOSOTROS
        </button>

    </div>

    <canvas id="canvas"></canvas>
</div>

<div class="seccion">
    <h2 id="titulo-seccion">Explora</h2>
    <div class="grid" id="contenido"></div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function ajustarCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = document.querySelector(".hero").offsetHeight;
}

const simbolos = ["+", "-", "×", "÷", "=", "π", "√", "∞", "∑"];

let particulas = [];

class Particula {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 25 + 15;
        this.speedY = Math.random() * 1 + 0.3;

        this.simbolo = simbolos[
            Math.floor(Math.random() * simbolos.length)
        ];

        this.opacity = Math.random() * 0.7 + 0.2;
    }

    update() {
        this.y += this.speedY;

        if (this.y > canvas.height) {
            this.y = -20;
            this.x = Math.random() * canvas.width;
        }
    }

    draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.font = this.size + "px Arial";
        ctx.fillText(this.simbolo, this.x, this.y);
    }
}

function init() {
    particulas = [];

    for (let i = 0; i < 80; i++) {
        particulas.push(new Particula());
    }
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particulas.forEach(p => {
        p.update();
        p.draw();
    });

    requestAnimationFrame(animate);
}

ajustarCanvas();
init();
animate();

window.addEventListener("resize", () => {
    ajustarCanvas();
    init();
});
</script>

</body>
</html>

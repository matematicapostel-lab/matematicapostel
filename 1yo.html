<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Temas - Aprende Matematica</title>

<style>

body{

    margin:0;

    font-family:Arial;

    background:#000814;

    color:white;

    text-align:center;

    overflow-x:hidden;

    overflow-y:auto;

}


canvas{

    position:fixed;

    top:0;

    left:0;

    width:100%;

    height:100%;

    z-index:0;

}


body > *:not(canvas){

    position:relative;

    z-index:2;

}

h1{

    font-size:45px;

    margin-top:50px;

    margin-bottom:30px;

    color:white;

    text-shadow:

        0 0 5px #0066ff,

        0 0 10px #0066ff,

        0 0 20px #0066ff,

        2px 2px 0 #003b8f;

}

.contenedor{

    display:flex;

    justify-content:center;

    gap:25px;

    flex-wrap:wrap;

    margin:40px;

}

.card{

    width:250px;

    padding:30px;

    cursor:pointer;

    border-radius:20px;

    background:

        linear-gradient(

            180deg,

            #1b5fd1 0%,

            #0a2d70 50%,

            #061a40 100%

        );

    color:white;

    border:8px solid #000;

    box-shadow:

        8px 10px 0 #000,

        0 0 10px #005eff,

        0 0 20px rgba(0,100,255,0.8);

    transition:0.3s;

}

.card h2{

    margin-top:5px;

    margin-bottom:15px;

    font-size:28px;

    color:white;

    text-shadow:

        0 0 4px #0066ff,

        0 0 8px #0066ff,

        2px 2px 0 #003b8f;

}


.card p{

    font-size:18px;

    color:white;

    text-shadow:

        0 0 4px #0066ff,

        0 0 8px #0066ff;

}

.card:hover{

    transform:scale(1.05);

    box-shadow:

        10px 12px 0 #000,

        0 0 15px #0077ff,

        0 0 30px #0066ff,

        0 0 45px rgba(0,100,255,0.7);

}

.oculto{

    display:none;

}

.boton{

    padding:15px 30px;

    margin:20px;

    font-size:18px;

    cursor:pointer;

    color:white;

    background:

        linear-gradient(

            180deg,

            #1b5fd1 0%,

            #0a2d70 50%,

            #061a40 100%

        );

    border:6px solid #000;

    border-radius:15px;

    box-shadow:

        6px 8px 0 #000,

        0 0 10px #0066ff,

        0 0 20px rgba(0,100,255,0.8);

    text-shadow:

        0 0 5px #0066ff,

        0 0 10px #0066ff;

    transition:0.3s;

}


.boton:hover{

    transform:scale(1.05);

    box-shadow:

        8px 10px 0 #000,

        0 0 15px #0077ff,

        0 0 30px #0066ff;

}


::-webkit-scrollbar{

    width:14px;

}


::-webkit-scrollbar-track{

    background:#000814;

}


::-webkit-scrollbar-thumb{

    background:

        linear-gradient(

            180deg,

            #1b5fd1,

            #06327e

        );

    border:3px solid #000;

    border-radius:10px;

    box-shadow:

        0 0 8px #0066ff;

}


::-webkit-scrollbar-thumb:hover{

    background:

        linear-gradient(

            180deg,

            #287dff,

            #0751bd

        );

}

</style>

</head>


<body>


<canvas id="canvas"></canvas>


<h1>TEMAS DE MATEMÁTICA</h1>


<div class="contenedor">

    <div class="card" onclick="mostrar(1)">

        <h2>1er Trimestre</h2>

        <p>Ver temas</p>

    </div>

    <div class="card" onclick="mostrar(2)">

        <h2>2do Trimestre</h2>

        <p>Ver temas</p>

    </div>

    <div class="card" onclick="mostrar(3)">

        <h2>3er Trimestre</h2>

        <p>Ver temas</p>

    </div>


</div>

<div id="temas" class="oculto">


    <h1 id="titulo"></h1>


    <div class="contenedor">


        <div class="card" onclick="irTema(1)">

            <h2>Tema 1</h2>

            <p>
                Entrar al Tema 1
            </p>

        </div>

        <div class="card" onclick="irTema(2)">

            <h2>Tema 2</h2>

            <p>
                Entrar al Tema 2
            </p>

        </div>


    </div>


</div>




<button
    class="boton"
    onclick="location.href='index.html'"
>

    Volver al inicio

</button>



<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");


canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;


const simbolos = [

    "+",
    "-",
    "×",
    "÷",
    "=",
    "π",
    "√",
    "∞",
    "∑"

];


let particulas = [];

let estrellas = [];


class Estrella{

    constructor(){

        this.x =
        Math.random() *
        canvas.width;

        this.y =
        Math.random() *
        canvas.height;

        this.size =
        Math.random() * 2;

        this.opacity =
        Math.random();

    }


    draw(){

        ctx.fillStyle =
        `rgba(255,255,255,${this.opacity})`;

        ctx.beginPath();

        ctx.arc(

            this.x,

            this.y,

            this.size,

            0,

            Math.PI * 2

        );

        ctx.fill();

    }

}

class Particula{

    constructor(){

        this.reset();

    }


    reset(){

        this.x =
        Math.random() *
        canvas.width;

        this.y =
        Math.random() *
        canvas.height;

        this.size =
        Math.random() * 25 + 15;

        this.speedY =
        Math.random() * 1 + 0.3;

        this.simbolo =
        simbolos[

            Math.floor(

                Math.random() *

                simbolos.length

            )

        ];


        this.opacity =
        Math.random() * 0.8 + 0.2;

    }


    update(){

        this.y +=
        this.speedY;


        if(

            this.y >

            canvas.height

        ){

            this.y = -20;


            this.x =
            Math.random() *
            canvas.width;

        }

    }


    draw(){

        ctx.fillStyle =
        `rgba(255,255,255,${this.opacity})`;


        ctx.font =
        this.size + "px Arial";


        ctx.fillText(

            this.simbolo,

            this.x,

            this.y

        );

    }

}

function init(){

    particulas = [];

    estrellas = [];


    for(

        let i = 0;

        i < 150;

        i++

    ){

        estrellas.push(

            new Estrella()

        );

    }


    for(

        let i = 0;

        i < 80;

        i++

    ){

        particulas.push(

            new Particula()

        );

    }

}

function animate(){

    ctx.clearRect(

        0,

        0,

        canvas.width,

        canvas.height

    );


    estrellas.forEach(

        e => e.draw()

    );


    particulas.forEach(

        p => {

            p.update();

            p.draw();

        }

    );


    requestAnimationFrame(

        animate

    );

}


init();

animate();

window.addEventListener(

    "resize",

    () => {

        canvas.width =
        window.innerWidth;

        canvas.height =
        window.innerHeight;

        init();

    }

);

let trimestreSeleccionado = 1;

function mostrar(trimestre){

    trimestreSeleccionado =
    trimestre;


    document
    .getElementById("temas")
    .classList
    .remove("oculto");


    let titulo = "";


    if(trimestre == 1){

        titulo =
        "Temas del 1er Trimestre";

    }


    if(trimestre == 2){

        titulo =
        "Temas del 2do Trimestre";

    }


    if(trimestre == 3){

        titulo =
        "Temas del 3er Trimestre";

    }


    document
    .getElementById("titulo")
    .innerText =
    titulo;


    document
    .getElementById("temas")
    .scrollIntoView({

        behavior:"smooth"

    });

}

function irTema(tema){


    if(

        trimestreSeleccionado == 1 &&

        tema == 1

    ){

        location.href =
        "temas 1.html";

    }


    else if(

        trimestreSeleccionado == 1 &&

        tema == 2

    ){

        location.href =
        "tema2.html";

    }

    else if(

        trimestreSeleccionado == 2 &&

        tema == 1

    ){

        location.href =
        "tema1 trimes2.html";

    }


    else if(

        trimestreSeleccionado == 2 &&

        tema == 2

    ){

        location.href =
        "tema 2 trime2.html";

    }

    else if(

        trimestreSeleccionado == 3 &&

        tema == 1

    ){

        location.href =
        "tema 1 trime3.html";

    }


    else if(

        trimestreSeleccionado == 3 &&

        tema == 2

    ){

        location.href =
        "tema2trime3.html";

    }

}

</script>


</body>

</html>
